<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f0eee6" fill-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="0.5" stop-color="#e8b07a"/>
      <stop offset="1" stop-color="#d97757"/>
      <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect width="840" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="840" height="300" fill="#141413"/>
    <rect width="840" height="300" fill="url(#dots)"/>
    <ellipse cx="150" cy="290" rx="190" ry="130" fill="#d97757" opacity="0.20" filter="url(#blur)">
      <animate attributeName="cx" values="150;210;120;150" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="20" rx="160" ry="110" fill="#e8b07a" opacity="0.20" filter="url(#blur)">
      <animate attributeName="cy" values="20;60;20" dur="9s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect x="0.5" y="0.5" width="839" height="299" rx="18" fill="none" stroke="#33312c"/>

  <text x="48" y="86" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#d97757">~/.claude  ⇄  git</text>
  <text x="44" y="150" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="60" font-weight="700" letter-spacing="-1" fill="#f0eee6">AI-<tspan fill="url(#shine)">Tooling</tspan></text>
  <rect x="48" y="170" width="64" height="3" rx="1.5" fill="#d97757">
    <animate attributeName="width" values="64;150;64" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text font-family="'Avenir Next','Segoe UI','Helvetica Neue',sans-serif" font-size="16" fill="#9c9a92">
    <tspan x="48" y="208">Prompts, instructions and skills for Claude,</tspan>
    <tspan x="48" y="230">kept in git and synced to the live apps.</tspan>
  </text>
  <text x="48" y="266" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9c9a92">setup <tspan fill="#d97757">·</tspan> check <tspan fill="#d97757">·</tspan> repair</text>

  <g filter="url(#shadow)">
    <rect x="432" y="36" width="380" height="236" rx="12" fill="#1f1e1b" stroke="#33312c"/>
  </g>
  <line x1="432" y1="64" x2="812" y2="64" stroke="#33312c"/>
  <circle cx="450" cy="50" r="4.5" fill="#d97757"/>
  <circle cx="465" cy="50" r="4.5" fill="#e8b07a"/>
  <circle cx="480" cy="50" r="4.5" fill="#33312c"/>
  <text x="622.0" y="54" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="10.5" fill="#9c9a92">zsh — ai-tooling</text>
  <clipPath id="type"><rect x="450" y="76.0" width="0" height="16"><animate attributeName="width" values="0;0;200;200" keyTimes="0;0.04;0.13;1" dur="10.0s" repeatCount="indefinite"/></rect></clipPath><text x="450" y="88.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#d97757">$</text><text x="464" y="88.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#f0eee6" clip-path="url(#type)">./setup.sh --check</text>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.170;0.180;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="450" y="104.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9c9a92">Files</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.225;0.235;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="466" y="121.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9ccc85">ok</text><text x="506" y="121.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#f0eee6">~/.claude/CLAUDE.md</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.280;0.290;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="466" y="137.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9ccc85">ok</text><text x="506" y="137.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#f0eee6">~/.claude/hooks/block_onedrive.sh</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.335;0.345;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="450" y="154.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9c9a92">Settings</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.390;0.400;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="466" y="170.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9ccc85">ok</text><text x="506" y="170.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#f0eee6">listing budget and OneDrive hook</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.445;0.455;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="450" y="187.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9c9a92">Plugins</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.500;0.510;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="466" y="203.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9ccc85">ok</text><text x="506" y="203.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#f0eee6">megapowers@megapowers</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.555;0.565;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="450" y="220.0" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9c9a92">MCP servers</text></g>
  <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.610;0.620;0.94;1" dur="10.0s" repeatCount="indefinite"/><text x="466" y="236.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9ccc85">ok</text><text x="506" y="236.5" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#f0eee6">microsoft-learn</text></g>
  <rect x="450" y="243.0" width="7" height="13" fill="#d97757"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect>
</svg>
